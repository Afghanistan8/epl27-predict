<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background, matching dark theme bg -->
  <rect width="32" height="32" rx="6" fill="#161513"/>

  <!-- Big "WC" in cream/white, italic serif — mirrors site logo -->
  <text x="16" y="22"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="900"
        font-style="italic"
        font-size="20"
        letter-spacing="-1"
        fill="#f3eee2">WC</text>

  <!-- Lime green tournament-marker dot (echoes the green '26 accent) -->
  <circle cx="26" cy="7" r="3.2" fill="#42c66c"/>
</svg>
